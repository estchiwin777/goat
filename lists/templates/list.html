<div style="margin-bottom: 20px;">
    <a href="/" id="id_back_home" class="btn btn-outline-secondary">← Back to Home</a>
    <span style="margin: 0 10px;">|</span>
</div>

<table id="id_list_table" class="table">
    {% for item in items %}
        <tr>
            <td>{{ forloop.counter }}: {{ item.text }}</td>
            <td>(Priority: {{ item.priority }})</td>
            <td>
                <form method="POST" action="{% url 'edit_priority' item.id %}">
                    {% csrf_token %}
                    <select name="priority_select">
                        <option value="High" {% if item.priority == 'High' %}selected{% endif %}>High</option>
                        <option value="Medium" {% if item.priority == 'Medium' %}selected{% endif %}>Medium</option>
                        <option value="Low" {% if item.priority == 'Low' %}selected{% endif %}>Low</option>
                    </select>
                    <button type="submit" id="id_edit_priority_{{ item.id }}">Update</button>
                </form>
            </td>
        </tr>
    {% endfor %}
</table>
