version: '3.8'

services:
  # Container ที่ 1: ฐานข้อมูล
  db:
    image: postgres:15
    container_name: goat-db  # ตั้งชื่อให้โชว์ใน docker ps
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"

  # Container ที่ 2: เว็บแอป (Django)
  web:
    build: .
    container_name: goat-web
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - db